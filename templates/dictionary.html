{% extends "base.html" %}

{% block title %}dictionary — {{ config.title }}{% endblock title %}

{% block content %}
<main>

<div class="wrap">
  <nav class="back-link">
    <a href="/">&larr; Home</a>
  </nav>

  <div class="terminal">
    <div class="terminal-bar">
      <span>tty2</span>
      <span></span>
    </div>
    <div class="terminal-body" style="align-items:stretch;">
      <div class="prompt"><span>$</span> dict</div>

      <form id="dict-form" class="dict-search">
        <span class="dict-prompt">></span>
        <input type="text" id="dict-input" class="dict-input" placeholder="type a word…" autocomplete="off" autofocus>
        <button type="submit" class="dict-submit">↵</button>
      </form>

      <div id="dict-output" class="dict-output"></div>
    </div>
  </div>
</div>

</main>

<script>
(function() {
  var API_BASE = 'https://en.wiktionary.org/api/rest_v1/page/definition/';
  var FETCH_TIMEOUT_MS = 8000;

  var form = document.getElementById('dict-form');
  var input = document.getElementById('dict-input');
  var submitBtn = form.querySelector('.dict-submit');
  var output = document.getElementById('dict-output');

  // Tracks the request currently allowed to write to the DOM. Any older,
  // superseded request checks against this before rendering.
  var currentController = null;

  var jabs = [
    'nice try. did you mean to spell that correctly?',
    'that\'s not a word. try again, genius.',
    'spell check is free, you know.',
    'did you hit the keyboard with your face?',
    'not in the dictionary. shocking.',
    'maybe try English next time.',
    'i looked it up. it doesn\'t exist. just like— nevermind.',
    'you call that a word?',
    'are you sure you know how to read?',
    'that word is as real as your plans.',
    'congratulations. you invented a word nobody uses.',
    'error 404: word not found. skill issue.',
    'did you have a stroke while typing?',
    'the dictionary said "lol no".',
    'that\'s not a word. try harder.',
    'are you typing with your elbows?',
    'even autocorrect gave up on that one.',
    'i googled it. nothing. embarrassing.',
  ];
  var kaomoji = [
    '(◍•ᴗ•◍)♡ ✧*。', '(つ◉益◉)つ', '(╯°□°）╯︵ ┻━┻',
    '(⊙_⊙)', '(¬_¬)', '(￣ヘ￣)', 'ಠ_ಠ', '(；一_一)',
    '(▀̿̿Ĺ̯̿̿▀̿ ̿)', '( ͡° ͜ʖ ͡°)', '(ʘ‿ʘ)', 'ʕ•ᴥ•ʔ',
    '(ノಠ益ಠ)ノ', '︵ヽ(`Д´)ﾉ︵', '┐(\'～`;)┌',
    '(◔_◔)', '(-_-;)', '(＃￣ω￣)', '＜（－︿－）＞',
    '(◕‿◕)', '(ᗒᗨᗕ)', 'ヽ(´ー｀)ノ', '＼(◎o◎)／',
    '(＾▽＾)', 'ᕙ(▀̿̿Ĺ̯̿̿▀̿ ̿)ᕗ', '┬─┬ノ( º _ ºノ)',
    '(ಥ_ಥ)', '(◞‸◟)', '〳◔Ĺ̯◔〵', '(;´Д`)',
    '(´-ω-`)', '〜(꒪꒳꒪)〜', '(˘̩̩̩̩̩̩̩̩˘)', '(个_个)',
    'ヽ(￣д￣;)ノ', '(￣□￣;)', '∑(O_O;)', '(╯▽╰)',
  ];

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Wiktionary definitions come as HTML fragments (with <a>, <span> links etc).
  // Parse them into plain text via the DOM, which also handles entities safely.
  function stripHTML(html) {
    if (!html) return '';
    var div = document.createElement('div');
    div.innerHTML = html;
    return (div.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function setLoading(isLoading) {
    input.disabled = isLoading;
    submitBtn.disabled = isLoading;
  }

  function bindRetry() {
    var btn = output.querySelector('.dict-retry');
    if (btn) {
      btn.addEventListener('click', function() {
        output.innerHTML = '';
        input.value = '';
        input.focus();
      });
    }
  }

  function renderNotFound() {
    var jab = jabs[Math.floor(Math.random() * jabs.length)];
    var kao = kaomoji[Math.floor(Math.random() * kaomoji.length)];
    output.innerHTML = '<div class="dict-mock">'
      + '<p class="dict-jab">' + escapeHTML(jab) + '</p>'
      + '<p class="dict-kao">' + escapeHTML(kao) + '</p>'
      + '<button class="dict-retry">try again ↵</button>'
      + '</div>';
    bindRetry();
  }

  function renderServerError() {
    output.innerHTML = '<div class="dict-mock">'
      + '<p class="dict-jab">dictionary\'s not answering right now. not your fault.</p>'
      + '<p class="dict-kao">(￣ヘ￣)</p>'
      + '<button class="dict-retry">try again ↵</button>'
      + '</div>';
    bindRetry();
  }

  function renderTimeoutError() {
    output.innerHTML = '<div class="dict-mock">'
      + '<p class="dict-jab">that took too long. try again?</p>'
      + '<p class="dict-kao">(-_-;)</p>'
      + '<button class="dict-retry">try again ↵</button>'
      + '</div>';
    bindRetry();
  }

  function renderResult(word, data) {
    // Wiktionary REST shape: { "en": [{ partOfSpeech, language, definitions: [...] }], "la": [...] }
    var langCodes = Object.keys(data);
    // Prefer English first when present, then show the rest as-is.
    langCodes.sort(function(a, b) {
      if (a === 'en') return -1;
      if (b === 'en') return 1;
      return 0;
    });

    var html = '<div class="dict-result">';
    html += '<div class="dict-word-row">';
    html += '<span class="dict-word">' + escapeHTML(word) + '</span>';
    html += '</div>';

    for (var li = 0; li < langCodes.length; li++) {
      var code = langCodes[li];
      var entries = data[code] || [];
      if (!entries.length) continue;

      var langName = entries[0].language || code.toUpperCase();
      html += '<div class="dict-lang">' + escapeHTML(langName) + '</div>';

      for (var e = 0; e < entries.length; e++) {
        var entry = entries[e];
        html += '<div class="dict-meaning">';
        html += '<span class="dict-pos">' + escapeHTML(entry.partOfSpeech || '') + '</span>';

        var defs = entry.definitions || [];
        for (var d = 0; d < Math.min(defs.length, 3); d++) {
          var def = defs[d];
          html += '<p class="dict-def">' + escapeHTML(stripHTML(def.definition)) + '</p>';
          var ex = (def.parsedExamples && def.parsedExamples.length)
            ? stripHTML(def.parsedExamples[0].example)
            : '';
          if (ex) {
            html += '<p class="dict-example">“' + escapeHTML(ex) + '”</p>';
          }
        }

        html += '</div>';
      }
    }

    html += '</div>';
    output.innerHTML = html;

    // Wiktionary's own audio lives in page media, not this endpoint, and
    // gstatic has no CORS headers, so probe availability with an <Audio>
    // element before showing the pronunciation button (only for gstatic hits).
    probeAudio(word);
  }

  function probeAudio(word) {
    // gstatic's dictionary files record a different speaker per word (some
    // male, some female), so they can't give one consistent voice. Google
    // Translate TTS blocks cross-origin browser requests entirely. tts.ai
    // (Kokoro) gives one fixed female voice for every word with full CORS:
    // POST the word -> get an mp3 URL -> play. The button is always shown;
    // generation happens lazily on click, falling back to gstatic if it fails.
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dict-audio';
    btn.setAttribute('aria-label', 'play pronunciation');
    btn.innerHTML = '&#9658;';

    var busy = false;
    btn.addEventListener('click', function() {
      if (busy) return;
      busy = true;
      btn.innerHTML = '…';

      fetch('https://api.tts.ai/v1/tts/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'kokoro', text: word, voice: 'af_bella', format: 'mp3' })
      })
        .then(function(r) {
          if (!r.ok) throw new Error('tts status ' + r.status);
          return r.json();
        })
        .then(function(data) {
          var url = data && data.result_url;
          if (!url) throw new Error('no result_url');
          return new Audio(url).play();
        })
        .catch(function() {
          // Fall back to Google's classic US recording (may be male for some
          // words, but better than nothing if tts.ai is down or rate-limited).
          var gs = 'https://ssl.gstatic.com/dictionary/static/sounds/20200429/'
            + encodeURIComponent(word) + '--_us_1.mp3';
          return new Audio(gs).play();
        })
        .catch(function() {})
        .then(function() {
          btn.innerHTML = '&#9658;';
          busy = false;
        });
    });

    var row = output.querySelector('.dict-word-row');
    if (row) row.appendChild(btn);
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var word = input.value.trim();
    if (!word) return;

    // Cancel whatever's still in flight — its result would be stale anyway.
    if (currentController) currentController.abort();
    var controller = new AbortController();
    currentController = controller;

    var timeoutId = setTimeout(function() { controller.abort(); }, FETCH_TIMEOUT_MS);

    setLoading(true);
    output.innerHTML = '<p class="dict-status"><span class="live-dot"></span> looking up…</p>';

    // Wiktionary page titles are case-sensitive; try the typed form first,
    // then fall back to lowercase before declaring the word not found.
    var attempts = [word];
    var lower = word.toLowerCase();
    if (lower !== word) attempts.push(lower);

    function tryLookup(i) {
      if (i >= attempts.length) {
        var nf = new Error('not found');
        nf.notFound = true;
        return Promise.reject(nf);
      }
      return fetch(API_BASE + encodeURIComponent(attempts[i]), { signal: controller.signal })
        .then(function(r) {
          if (!r.ok) {
            // A genuine Wiktionary miss is a 404 with an error JSON body.
            // Anything else (5xx, HTML, connection error) is an outage.
            if (r.status === 404) return tryLookup(i + 1);
            throw new Error('server error: ' + r.status);
          }
          return r.json();
        });
    }

    tryLookup(0)
      .then(function(data) {
        clearTimeout(timeoutId);
        if (!Object.keys(data).length) {
          var nf2 = new Error('not found');
          nf2.notFound = true;
          throw nf2;
        }
        renderResult(word, data);
      })
      .catch(function(err) {
        clearTimeout(timeoutId);
        // A newer submit already took over — let it own the output, say nothing here.
        if (controller !== currentController) return;

        if (err && err.name === 'AbortError') {
          renderTimeoutError();
        } else if (err && err.notFound) {
          renderNotFound();
        } else {
          renderServerError();
        }
      })
      .then(function() {
        if (controller === currentController) setLoading(false);
      });
  });
})();
</script>
{% endblock content %}
