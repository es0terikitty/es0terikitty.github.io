<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.v2.css">
  <link rel="icon" href="/astronomy.png" type="image/png">
  <style>
@font-face{font-family:"Cagliostro";src:url("/fonts/Cagliostro-Regular.ttf") format("truetype");font-weight:normal;font-style:normal;font-display:swap}@font-face{font-family:"CaskaydiaMono Nerd Font";src:url("/fonts/CaskaydiaMonoNerdFont-Regular.ttf") format("truetype");font-weight:normal;font-style:normal;font-display:swap}@font-face{font-family:"CaskaydiaMono Nerd Font";src:url("/fonts/CaskaydiaMonoNerdFont-Bold.ttf") format("truetype");font-weight:bold;font-style:normal;font-display:swap}@font-face{font-family:"Montserrat";src:url("/fonts/Montserrat-VariableFont_wght.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}@font-face{font-family:"Montserrat";src:url("/fonts/Montserrat-Italic-VariableFont_wght.ttf") format("truetype");font-weight:100 900;font-style:italic;font-display:swap}
:root{--bg:#000000;--surface:#101010;--surface2:#181818;--text:#F6F2EC;--text-dim:#B7AEA3;--accent:#FF6B4A;--green:#D62828;--pink:#F77F00;--border:#2A2A2A;--font-ui:"JetBrainsMono Nerd Font","JetBrains Mono","Menlo",monospace;--font-body:"Montserrat",Georgia,serif;--font-heading:"Cagliostro",Georgia,serif;--font-size:15px;--line-height:1.6;--max-width:800px}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--font-size);line-height:var(--line-height);-webkit-font-smoothing:antialiased}h1,h2,h3,h4,h5,h6{font-family:var(--font-heading)}a{color:var(--accent);text-decoration:none}.top-nav{max-width:var(--max-width);margin:0 auto;padding:28px 24px 24px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:0;font-family:var(--font-ui)}.site-title{font-family:"CaskaydiaMono Nerd Font","CaskaydiaMono NF",var(--font-ui);color:var(--accent)!important;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:21px;line-height:1.1}.subtitle{color:var(--text-dim);font-size:12px;margin-top:6px}main{max-width:var(--max-width);margin:0 auto;padding:24px 24px 40px}.chapter-body p{margin-bottom:1.4em}
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="/" class="site-title">{{ config.title }}</a>
    <span class="subtitle">{{ config.description }}</span>
  </nav>

  <main>
    {% block content %}{% endblock content %}
  </main>
</body>
</html>
