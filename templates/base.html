<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); return; } } catch(e) {}
      if (window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/atom.xml">
  <meta name="description" content="{{ config.description }}">
</head>
<body>

<nav class="top wrap">
  <a href="/" class="logo">es0terikitty</a>
  <ul class="nav-links" id="nav-links">
    <li><a href="#notes">novels</a></li>
    <li><a href="#studies">studies</a></li>
    <li><a href="#stack">stack</a></li>
    <li><a href="#now">now</a></li>
    <li><a href="https://github.com/es0terikitty" class="ext">github</a></li>
  </ul>
  <div class="nav-actions">
    <button class="nav-action-btn" id="theme-toggle" aria-label="Switch to light mode">☀</button>
    <button class="nav-action-btn nav-toggle" aria-label="toggle menu" id="nav-toggle">≡</button>
  </div>
</nav>

{% block content %}{% endblock content %}

<footer class="footer">
  <div class="rule">░▒▓█▓▒░</div>
  <div class="meta">
    <a href="https://github.com/es0terikitty/es0terikitty.github.io">source</a>
  </div>
</footer>

<script src="/js/copy.js"></script>
<script>
(function() {
  var html = document.documentElement;
  var btn = document.getElementById('theme-toggle');

  function setBtn(theme) {
    btn.textContent = theme === 'light' ? '\u263E' : '\u2600';
    btn.setAttribute('aria-label', theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode');
  }

  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch(e) {}

  if (saved === 'light') setBtn('light');
  else if (saved === 'dark') setBtn('dark');
  else if (window.matchMedia('(prefers-color-scheme: light)').matches) { html.setAttribute('data-theme', 'light'); setBtn('light'); }
  else setBtn('dark');

  btn.addEventListener('click', function() {
    var isLight = html.getAttribute('data-theme') === 'light';
    var next = isLight ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch(e) {}
    setBtn(next);
  });
})();
</script>
</body>
</html>
