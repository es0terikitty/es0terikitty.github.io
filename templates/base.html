<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.v2.css">
  <link rel="icon" href="/es0terikitty.jpg" type="image/jpeg">
  <style>
@font-face{font-family:"Cagliostro";src:url("/fonts/Cagliostro-Regular.ttf") format("truetype");font-weight:normal;font-style:normal;font-display:swap}
:root{--bg:#0F0F0F;--surface:#1E1E1E;--surface2:#292929;--text:#F4DECD;--text-dim:#A9A9A9;--accent:#EF934D;--green:#7EC97E;--pink:#E28DC6;--border:#353535;--link:#EF934D;--link-hover:#EFBF71;--font-body:"Cagliostro",Georgia,serif;--font-size:15px;--line-height:1.6;--max-width:800px}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--font-size);line-height:var(--line-height);-webkit-font-smoothing:antialiased}h1,h2,h3,h4,h5,h6{font-family:var(--font-body)}a{color:var(--accent);text-decoration:none}.top-nav{max-width:var(--max-width);margin:0 auto;padding:28px 24px 24px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:0;font-family:var(--font-body)}.site-title{font-family:var(--font-body);font-size:21px;font-weight:700;color:var(--accent)!important;text-transform:uppercase;letter-spacing:1.5px;line-height:1.1}.subtitle{color:var(--text-dim);font-size:12px;margin-top:6px}main{max-width:var(--max-width);margin:0 auto;padding:24px 24px 40px}.chapter-body p{margin-bottom:1.4em}
  </style>
</head>
<body>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <nav class="top-nav">
    <a href="/" class="site-title">{{ config.title }}</a>
    <span class="subtitle">{{ config.description }}</span>
  </nav>

  <main>
    {% block content %}{% endblock content %}
  </main>
<script>(function(){var themes={'':{bg:'#0F0F0F',surface:'#1E1E1E',surface2:'#292929',text:'#F4DECD','text-dim':'#A9A9A9',accent:'#EF934D',green:'#7EC97E',pink:'#E28DC6',border:'#353535',link:'#EF934D','link-hover':'#EFBF71'},'theme-catpuccin':{bg:'#1e1e2e',surface:'#313244',surface2:'#45475a',text:'#cdd6f4','text-dim':'#a6adc8',accent:'#cba6f7',green:'#a6e3a1',pink:'#f5c2e7',border:'#45475a',link:'#cba6f7','link-hover':'#89b4fa'},'theme-gruvbox':{bg:'#282828',surface:'#3c3836',surface2:'#504945',text:'#ebdbb2','text-dim':'#a89984',accent:'#d79921',green:'#8ec07c',pink:'#b16286',border:'#504945',link:'#d79921','link-hover':'#fabd2f'},'theme-nord':{bg:'#2E3440',surface:'#3B4252',surface2:'#434C5E',text:'#E5E9F0','text-dim':'#D8DEE9',accent:'#5E81AC',green:'#A3BE8C',pink:'#B48EAD',border:'#434C5E',link:'#5E81AC','link-hover':'#88C0D0'},'theme-paper':{bg:'#F4EBD9',surface:'#E8DCC8',surface2:'#DCC8A8',text:'#1A2E40','text-dim':'#4A3525',accent:'#2D5A27',green:'#3A7D35',pink:'#D4AF37',border:'#4A3525',link:'#2D5A27','link-hover':'#D4AF37'}};function apply(t){var th=themes[t];if(!th)return;var r=document.documentElement.style;for(var k in th)r.setProperty('--'+k,th[k]);localStorage.setItem('theme',t);document.querySelectorAll('.theme-swatch').forEach(function(s){s.classList.toggle('active',s.dataset.theme===t)})}var s=localStorage.getItem('theme');if(s)apply(s);else apply('');document.addEventListener('click',function(e){var n=e.target.closest('[data-theme]');if(n)apply(n.dataset.theme)});var pf=document.getElementById('progressFill');if(pf){window.addEventListener('scroll',function(){var h=document.documentElement.scrollHeight-window.innerHeight;pf.style.width=h>0?(window.scrollY/h*100)+'%':'0%'})}})();</script>
</body>
</html>
