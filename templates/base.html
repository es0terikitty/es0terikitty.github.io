<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.v2.css">
  <link rel="icon" href="/meteor.png" type="image/png">
  <style>
@font-face{font-family:"Cagliostro";src:url("/fonts/Cagliostro-Regular.ttf") format("truetype");font-weight:normal;font-style:normal;font-display:swap}
:root{--bg:#000000;--surface:#101010;--surface2:#181818;--text:#F6F2EC;--text-dim:#B7AEA3;--accent:#FF6B4A;--green:#D62828;--pink:#F77F00;--border:#2A2A2A;--link:#ef934d;--link-hover:#FF6B4A;--font-body:"Cagliostro",Georgia,serif;--font-size:15px;--line-height:1.6;--max-width:800px}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--font-size);line-height:var(--line-height);-webkit-font-smoothing:antialiased}h1,h2,h3,h4,h5,h6{font-family:var(--font-body)}a{color:var(--accent);text-decoration:none}.top-nav{max-width:var(--max-width);margin:0 auto;padding:28px 24px 24px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:0;font-family:var(--font-body)}.site-title{font-family:var(--font-body);font-size:21px;font-weight:700;color:var(--accent)!important;text-transform:uppercase;letter-spacing:1.5px;line-height:1.1}.subtitle{color:var(--text-dim);font-size:12px;margin-top:6px}main{max-width:var(--max-width);margin:0 auto;padding:24px 24px 40px}.chapter-body p{margin-bottom:1.4em}
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="/" class="site-title">{{ config.title }}</a>
    <span class="subtitle">{{ config.description }}</span>
  </nav>

  <main>
    {% block content %}{% endblock content %}
  </main>
<script>(function(){var themes={'':{bg:'#000000',surface:'#101010',surface2:'#181818',text:'#F6F2EC','text-dim':'#B7AEA3',accent:'#FF6B4A',green:'#D62828',pink:'#F77F00',border:'#2A2A2A',link:'#ef934d','link-hover':'#FF6B4A'},'theme-catpuccin':{bg:'#1e1e2e',surface:'#313244',surface2:'#45475a',text:'#cdd6f4','text-dim':'#a6adc8',accent:'#f38ba8',green:'#a6e3a1',pink:'#cba6f7',border:'#45475a',link:'#8bd3c8','link-hover':'#f38ba8'},'theme-gruvbox':{bg:'#282828',surface:'#3c3836',surface2:'#504945',text:'#ebdbb2','text-dim':'#a89984',accent:'#d65d0e',green:'#98971a',pink:'#b16286',border:'#504945',link:'#d79921','link-hover':'#d65d0e'},'theme-nord':{bg:'#2e3440',surface:'#3b4252',surface2:'#434c5e',text:'#eceff4','text-dim':'#d8dee9',accent:'#88c0d0',green:'#a3be8c',pink:'#b48ead',border:'#4c566a',link:'#d38f73','link-hover':'#88c0d0'}};function apply(t){var th=themes[t];if(!th)return;var r=document.documentElement.style;for(var k in th)r.setProperty('--'+k,th[k]);localStorage.setItem('theme',t)}var s=localStorage.getItem('theme');if(s)apply(s);document.addEventListener('click',function(e){var n=e.target.closest('[data-theme]');if(n)apply(n.dataset.theme)})})();</script>
</body>
</html>
