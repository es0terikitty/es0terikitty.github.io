<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.v2.css">
  <link rel="icon" href="/es0terikitty.jpg" type="image/jpeg">
  <style>
@font-face{font-family:"Cagliostro";src:url("/fonts/Cagliostro-Regular.ttf") format("truetype");font-weight:normal;font-style:normal;font-display:swap}
:root{--bg:#0F0F0F;--surface:#1E1E1E;--surface2:#292929;--text:#F4DECD;--text-dim:#A9A9A9;--accent:#EF934D;--green:#7EC97E;--pink:#E28DC6;--border:#353535;--link:#EF934D;--link-hover:#EFBF71;--font-body:"Cagliostro",Georgia,serif;--font-size:15px;--line-height:1.6;--max-width:800px}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--font-size);line-height:var(--line-height);-webkit-font-smoothing:antialiased}h1,h2,h3,h4,h5,h6{font-family:var(--font-body)}a{color:var(--accent);text-decoration:none}.top-nav{max-width:var(--max-width);margin:0 auto;padding:28px 24px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-family:var(--font-body)}.nav-left{display:flex;flex-direction:column}.site-title{font-family:var(--font-body);font-size:21px;font-weight:700;color:var(--accent)!important;text-transform:uppercase;letter-spacing:1.5px;line-height:1.1}.subtitle{color:var(--text-dim);font-size:12px;margin-top:6px}main{max-width:var(--max-width);margin:0 auto;padding:24px 24px 40px}.chapter-body p{margin-bottom:1.4em}.theme-btn{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-body);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:6px 12px;border-radius:4px;cursor:pointer;transition:color 0.15s,border-color 0.15s}.theme-btn:hover{color:var(--accent);border-color:var(--accent)}.theme-menu{display:none;position:absolute;top:100%;right:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 0;min-width:120px;z-index:100}.theme-menu.open{display:block}.theme-menu span{display:block;padding:8px 16px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);cursor:pointer;transition:color 0.15s,background 0.15s}.theme-menu span:hover{color:var(--accent);background:var(--surface2)}.theme-menu span.active{color:var(--accent)}.theme-dropdown{position:relative}
  </style>
</head>
<body>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <nav class="top-nav">
    <div class="nav-left">
      <a href="/" class="site-title">{{ config.title }}</a>
      <span class="subtitle">{{ config.description }}</span>
    </div>
    <div class="theme-dropdown">
      <button class="theme-btn" id="themeToggle">Theme ▾</button>
      <div class="theme-menu" id="themeMenu">
        <span data-theme="">Caelus</span>
        <span data-theme="theme-catpuccin">Mocha</span>
        <span data-theme="theme-gruvbox">Gruvbox</span>
        <span data-theme="theme-nord">Nord</span>
        <span data-theme="theme-paper">Paper</span>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock content %}
  </main>
<script>(function(){var themes={'':{bg:'#0F0F0F',surface:'#1E1E1E',surface2:'#292929',text:'#F4DECD','text-dim':'#A9A9A9',accent:'#EF934D',green:'#7EC97E',pink:'#E28DC6',border:'#353535',link:'#EF934D','link-hover':'#EFBF71'},'theme-catpuccin':{bg:'#1e1e2e',surface:'#313244',surface2:'#45475a',text:'#cdd6f4','text-dim':'#a6adc8',accent:'#cba6f7',green:'#a6e3a1',pink:'#f5c2e7',border:'#45475a',link:'#cba6f7','link-hover':'#89b4fa'},'theme-gruvbox':{bg:'#282828',surface:'#3c3836',surface2:'#504945',text:'#ebdbb2','text-dim':'#a89984',accent:'#d79921',green:'#8ec07c',pink:'#b16286',border:'#504945',link:'#d79921','link-hover':'#fabd2f'},'theme-nord':{bg:'#2E3440',surface:'#3B4252',surface2:'#434C5E',text:'#E5E9F0','text-dim':'#D8DEE9',accent:'#5E81AC',green:'#A3BE8C',pink:'#B48EAD',border:'#434C5E',link:'#5E81AC','link-hover':'#88C0D0'},'theme-paper':{bg:'#F4EBD9',surface:'#E8DCC8',surface2:'#DCC8A8',text:'#1A2E40','text-dim':'#4A3525',accent:'#2D5A27',green:'#3A7D35',pink:'#D4AF37',border:'#4A3525',link:'#2D5A27','link-hover':'#D4AF37'}};var m=document.getElementById('themeMenu'),t=document.getElementById('themeToggle');t.addEventListener('click',function(e){e.stopPropagation();m.classList.toggle('open')});function apply(th){var o=themes[th];if(!o)return;var r=document.documentElement.style;for(var k in o)r.setProperty('--'+k,o[k]);localStorage.setItem('theme',th);m.querySelectorAll('span').forEach(function(s){s.classList.toggle('active',s.dataset.theme===th)})}var s=localStorage.getItem('theme');if(s)apply(s);else apply('');m.addEventListener('click',function(e){var n=e.target.closest('[data-theme]');if(n){apply(n.dataset.theme);m.classList.remove('open')}});document.addEventListener('click',function(){m.classList.remove('open')});var pf=document.getElementById('progressFill');if(pf){window.addEventListener('scroll',function(){var h=document.documentElement.scrollHeight-window.innerHeight;pf.style.width=h>0?(window.scrollY/h*100)+'%':'0%'})}})();</script>
</body>
</html>
