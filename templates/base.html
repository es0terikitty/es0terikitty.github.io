<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}document.documentElement.setAttribute('data-theme',t||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'))})();</script>
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/atom.xml">
  <meta name="description" content="{{ config.description }}">
</head>
<body>
{% block canvas %}<canvas id="grid-canvas"></canvas>{% endblock canvas %}

<nav class="top wrap">
  <a href="/" class="logo">es0terikitty</a>
  <ul class="nav-links" id="nav-links">
    <li><a href="#notes">novels</a></li>
    <li><a href="#stack">stack</a></li>
    <li><a href="#now">now</a></li>
    <li><a href="https://github.com/es0terikitty" class="ext">github</a></li>
  </ul>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <span class="icon-sun"></span>
    <span class="icon-moon"></span>
  </button>
  <button class="nav-toggle" aria-label="toggle menu" id="nav-toggle">≡</button>
</nav>

{% block content %}{% endblock content %}

<footer class="footer">
  <div class="rule">░▒▓█▓▒░</div>
  <div class="meta">
    <a href="https://github.com/es0terikitty/es0terikitty.github.io">source</a>
  </div>
</footer>

<script src="/js/copy.js"></script>
<script src="/js/theme.js"></script>
{% block extrascripts %}<script src="/js/grid.js"></script>{% endblock extrascripts %}
</body>
</html>
