<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/es0terikitty.jpg" type="image/jpeg">
  <meta name="description" content="{{ config.description }}">
</head>
<body>

<nav class="top wrap">
  <a href="/" class="logo">es0terikitty</a>
  <button class="nav-toggle" aria-label="toggle menu" id="nav-toggle">≡</button>

    <li><a href="#stack">stack</a></li>
    <li><a href="#now">now</a></li>
    <li><a href="https://github.com/es0terikitty" class="ext">github</a></li>
  </ul>
</nav>

{% block content %}{% endblock content %}

<footer class="footer">
  <div class="rule">░▒▓█▓▒░</div>
  <div class="meta">
    es0terikitty &middot; built in neovim &middot; <a href="https://github.com/es0terikitty/es0terikitty.github.io">source</a>
  </div>
</footer>

<script src="/js/copy.js"></script>

</html>
