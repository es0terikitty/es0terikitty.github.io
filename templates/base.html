<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}var v=['aqua','crimson','emerald','mizuki-akiyama','gruvbox'];if(v.indexOf(t)<0)t='crimson';document.documentElement.setAttribute('data-theme',t);document.documentElement.classList.add('js')})();</script>
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/atom.xml">
  <meta name="description" content="{{ config.description }}">
</head>
<body>
<div id="scroll-bar" aria-hidden="true"></div>
{% block canvas %}<canvas id="grid-canvas"></canvas>{% endblock canvas %}

<nav class="top wrap">
  <a href="/" class="logo">hiraeth</a>
  <ul class="nav-links" id="nav-links">
    <li><a href="#notes">novels</a></li>
    <li><a href="#stack">stack</a></li>
    <li><a href="#dictionary">dictionary</a></li>
    <li><a href="https://github.com/hiraeth-dev" class="ext">github</a></li>
  </ul>
  <div class="theme-pick">
    <button class="theme-btn" id="theme-btn" type="button" aria-haspopup="true" aria-expanded="false">theme</button>
    <div class="theme-menu" id="theme-menu">
      <button type="button" data-theme-opt="gruvbox">gruvbox</button>
      <button type="button" data-theme-opt="aqua">aqua</button>
      <button type="button" data-theme-opt="crimson">crimson</button>
      <button type="button" data-theme-opt="emerald">emerald</button>
      <button type="button" data-theme-opt="mizuki-akiyama">mizuki</button>
    </div>
  </div>
</nav>

{% block content %}{% endblock content %}

<footer class="footer">
  <a href="https://github.com/hiraeth-dev/hiraeth-dev.github.io" class="rule">(&gt;.&lt;) zzZ</a>
</footer>

<script src="/js/copy.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/anim.js"></script>
{% block extrascripts %}<script src="/js/grid.js"></script>{% endblock extrascripts %}
</body>
</html>
