<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/atom.xml">
  <meta name="description" content="{{ config.description }}">
</head>
<body>

<nav class="top wrap">
  <a href="/" class="logo">es0terikitty</a>
  <ul class="nav-links" id="nav-links">
    <li><a href="#notes">novels</a></li>
    <li><a href="#studies">studies</a></li>
    <li><a href="#stack">stack</a></li>
    <li><a href="#now">now</a></li>
    <li><a href="https://github.com/es0terikitty" class="ext">github</a></li>
  </ul>
  <div class="nav-actions">
    <button class="theme-toggle" id="theme-toggle" aria-label="toggle theme">☀</button>
    <button class="nav-toggle" aria-label="toggle menu" id="nav-toggle">≡</button>
  </div>
</nav>

{% block content %}{% endblock content %}

<footer class="footer">
  <div class="rule">░▒▓█▓▒░</div>
  <div class="meta">
    <a href="https://github.com/es0terikitty/es0terikitty.github.io">source</a>
  </div>
</footer>

<script src="/js/copy.js"></script>
<script>
(function() {
  var html = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var saved = localStorage.getItem('theme');
  var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;

  if (saved === 'light' || (!saved && prefersLight)) {
    html.setAttribute('data-theme', 'light');
    btn.textContent = '\u263E';
  }

  btn.addEventListener('click', function() {
    var isLight = html.getAttribute('data-theme') === 'light';
    if (isLight) {
      html.removeAttribute('data-theme');
      localStorage.setItem('theme', 'dark');
      btn.textContent = '\u2600';
    } else {
      html.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');
      btn.textContent = '\u263E';
    }
  });
})();
</script>
</body>
</html>
